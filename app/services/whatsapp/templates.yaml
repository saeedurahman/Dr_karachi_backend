# WhatsApp Cloud API Message Templates Configuration
# Maps internal business keys to Meta registered template names,
# categories (transactional vs marketing), supported language codes, and ordered parameters.

appointment_confirmed:
  template_name: appointment_confirmed
  category: transactional
  languages:
    en: en
    ur: ur
  body_params:
    - patient_name
    - doctor_name
    - slot_datetime
    - clinic_branch

appointment_reminder_1h:
  template_name: appointment_reminder_1h
  category: transactional
  languages:
    en: en
    ur: ur
  body_params:
    - patient_name
    - doctor_name
    - slot_datetime
    - clinic_branch

appointment_cancelled:
  template_name: appointment_cancelled
  category: transactional
  languages:
    en: en
    ur: ur
  body_params:
    - patient_name
    - doctor_name
    - slot_datetime
    - reason

order_status:
  template_name: order_status_update
  category: transactional
  languages:
    en: en
    ur: ur
  body_params:
    - customer_name
    - order_number
    - status
    - total_amount

order_confirmed:
  template_name: order_confirmed
  category: transactional
  languages:
    en: en
    ur: ur
  body_params:
    - customer_name
    - order_number
    - total_amount

lab_report_ready:
  template_name: lab_report_ready
  category: transactional
  languages:
    en: en
    ur: ur
  body_params:
    - patient_name
    - branch_name
    - report_url

promotional_offer:
  template_name: promotional_offer
  category: marketing
  opt_out_hint: "Reply STOP to unsubscribe"
  note: "Reply STOP to unsubscribe"
  languages:
    en: en
    ur: ur
  body_params:
    - customer_name
    - offer_title
    - discount_details
    - expiry_date
