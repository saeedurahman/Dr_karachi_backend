name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karachi_user
          POSTGRES_PASSWORD: karachi_pass
          POSTGRES_DB: karachi_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov

      - name: Run code formatting & linting checks
        run: |
          ruff check app/ tests/

      - name: Run Alembic migrations check
        env:
          DATABASE_URL: postgresql+asyncpg://karachi_user:karachi_pass@localhost:5432/karachi_test_db
          SYNC_DATABASE_URL: postgresql+psycopg2://karachi_user:karachi_pass@localhost:5432/karachi_test_db
          SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars
        run: |
          alembic upgrade head

      - name: Run automated test suite (Unit, Integration & Concurrency)
        env:
          DATABASE_URL: postgresql+asyncpg://karachi_user:karachi_pass@localhost:5432/karachi_test_db
          TEST_DATABASE_URL: postgresql+asyncpg://karachi_user:karachi_pass@localhost:5432/karachi_test_db
          SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars
          STORAGE_BACKEND: local
        run: |
          pytest --cov=app --cov-report=term-missing
